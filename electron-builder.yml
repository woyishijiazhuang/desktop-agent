appId: com.desktop-agent.app
productName: 桌面助手
directories:
  buildResources: build
files:
  # 显式声明全量模式：files 存在正向 include（onnx/vad 资源）时不会自动补 **/*，
  # 否则 out/、resources/ 等运行时文件会被漏打包（asar 校验报 entry 缺失）
  - '**/*'
  - '!**/.vscode/*'
  - '!src/*'
  - '!{scripts,docs,.trae}/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.oxfmtrc.jsonc,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml,.editorconfig,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!electron-builder.yml'
  # node_modules 内的开发内容：源码映射 / 类型声明 / SDK 自带示例，运行时均不需要
  - '!**/*.map'
  - '!**/*.{d.ts,d.mts,d.cts}'
  # 纯类型声明包（含经 protobufjs → @types/node 带入的 undici-types），运行时绝不 require
  - '!node_modules/@types/**'
  - '!node_modules/undici-types/**'
  - '!node_modules/@modelcontextprotocol/sdk/dist/**/examples/**'
  # 语音 VAD：JS 已由 vite 打进渲染产物，运行时仅需 wasm / onnx 资源（appasset:// 协议读取），
  # onnxruntime-web 全量 dist ~133MB，排除后只保留实际会被加载的文件：
  #  - asset-protocol 会把一切 wasm 请求回退到 ort-wasm-simd-threaded.wasm（唯一运行时加载的 wasm），
  #    故 jsep/jspi/asyncify 三个变体（~66MB）不打包；
  #  - 4 个 Emscripten 胶水 .mjs 按名直接服务，保留以兼容动态 import。
  - '!node_modules/onnxruntime-web/**'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jspi.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs'
  - '!node_modules/@ricky0123/vad-web/**'
  - 'node_modules/@ricky0123/vad-web/dist/silero_vad_legacy.onnx'
  - 'node_modules/@ricky0123/vad-web/dist/silero_vad_v5.onnx'
  # VAD 的 AudioWorklet 模块：MicVAD 以 AudioWorklet 模式运行时经
  # appasset://voice/vad.worklet.bundle.min.js addModule 加载（独立 webpack bundle，自包含）
  - 'node_modules/@ricky0123/vad-web/dist/vad.worklet.bundle.min.js'
asarUnpack:
  - resources/**
# Electron Fuses：打包时翻转 Electron 二进制内的特性位（签名后由 OS 保证不可回改）。
# 仅影响发布包，dev 直接跑 node_modules/electron 不经打包，行为不变。
# 校验：npx @electron/fuses read --app dist/mac-arm64/桌面助手.app
electronFuses:
  runAsNode: false # 禁止 ELECTRON_RUN_AS_NODE 把应用本体当裸 Node 运行（LOLBin 攻击面）
  enableCookieEncryption: true # Cookie 库用系统密钥加密存储（单向变更，新应用可直接开）
  enableNodeOptionsEnvironmentVariable: false # 忽略 NODE_OPTIONS / NODE_EXTRA_CA_CERTS 注入
  enableNodeCliInspectArguments: false # 忽略 --inspect 调试参数，SIGUSR1 也无法挂调试器
  enableEmbeddedAsarIntegrityValidation: true # 加载 app.asar 前校验嵌入的 SHA256（mac≥16/win≥30，哈希由 builder 自动注入）
  onlyLoadAppFromAsar: true # 只从 app.asar 找应用代码，封堵 resources/app 目录旁路
  loadBrowserProcessSpecificV8Snapshot: false # 未使用自定义 V8 快照
  # 必须保持开启：渲染层经 webContents.loadFile() 以 file:// 从 app.asar 加载
  # out/renderer/**.html（window-manager.ts）。翻转关闭后 Chromium 网络服务
  # 拒绝 file:// 读取 asar 内文件，三个入口全部 ERR_FILE_NOT_FOUND，窗口白屏。
  # 官方安全建议是改用自定义协议（app://）提供页面；本应用仍是 file:// 方案，不可关。
  grantFileProtocolExtraPrivileges: true
  # 本机/CI 无 Developer ID 时签名步骤会整体跳过，翻转二进制后原有 linker 签名失效，
  # Apple Silicon 会直接 SIGKILL。开启此项让 @electron/fuses 翻转后对主二进制重新 ad-hoc 签名。
  # 将来用正式证书签名时，builder 的正式签名会覆盖它，无副作用。
  resetAdHocDarwinSignature: true
# srt（bash 沙箱）随包携带的平台 helper，按平台拆分：
#  - Windows 需 srt-win.exe（沙箱账户供给/WFP 与进程隔离后端）
#  - Linux 需 apply-seccomp（seccomp 过滤器落地二进制）
# 目录为双架构（x64/arm64），运行时由 sandbox.ts 按 process.arch 定位；macOS 走系统
# Seatbelt，不需要任何 helper，故 mac 不再拷贝。
win:
  executableName: 桌面助手
  # 多尺寸 ico（16~256，小帧内容撑满），避免任务栏图标因大图留白缩显得偏小
  icon: build/icon.ico
  extraResources:
    - from: node_modules/@anthropic-ai/sandbox-runtime/vendor/srt-win
      to: srt-win
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 向导式安装器（非一键）：允许用户自定义安装目录
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # 未签名/notarize=false 时 entitlements 不生效，保留 JIT 兼容项以备开发签名
  entitlementsInherit: build/entitlements.mac.plist
  # zip 是 electron-updater（Squirrel.Mac）的更新校验包，必须随 dmg 一起产出
  target:
    - dmg
    - zip
  extendInfo:
    - NSDocumentsFolderUsageDescription: 桌面助手需要访问"文稿"文件夹以读写文件。
    - NSDownloadsFolderUsageDescription: 桌面助手需要访问"下载"文件夹以读写文件。
    - NSMicrophoneUsageDescription: 桌面助手需要使用麦克风进行语音对话。
  notarize: false
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: desktop-agent
  category: Utility
  extraResources:
    - from: node_modules/@anthropic-ai/sandbox-runtime/vendor/seccomp
      to: seccomp
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 只保留中文和英文语言包，去掉其余 ~45MB 的无用 Electron locales
electronLanguages:
  - zh-CN
  - en-US
# 更新发布源：GitHub Releases（仓库 woyishijiazhuang/desktop-agent）。
# 发布时在 CI/本机设置 GH_TOKEN（或个人访问令牌）后执行
#   electron-builder --win --publish always / electron-builder --mac --publish always
# 产物与 latest*.yml / .blockmap 会上传到该仓库的 Release（electron-updater 据此增量更新）。
publish:
  provider: github
  owner: woyishijiazhuang
  repo: desktop-agent
  # 默认发布到正式 release（可改 draft/prerelease 做灰度）
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
