appId: com.desktop-agent.app
productName: 桌面助手
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{scripts,docs,.trae}/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml,.editorconfig,.gitignore}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!electron-builder.yml'
  # node_modules 内的开发内容：源码映射 / 类型声明 / SDK 自带示例，运行时均不需要
  - '!**/*.map'
  - '!**/*.{d.ts,d.mts,d.cts}'
  - '!node_modules/@modelcontextprotocol/sdk/dist/**/examples/**'
  # 语音 VAD：JS 已由 vite 打进渲染产物，运行时仅需 wasm / onnx 资源（appasset:// 协议读取），
  # onnxruntime-web 全量 dist ~133MB，排除后只保留 4 个 wasm 变体 + 4 个 Emscripten 胶水 .mjs
  - '!node_modules/onnxruntime-web/**'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.wasm'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jspi.wasm'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.wasm'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jsep.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.jspi.mjs'
  - 'node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.asyncify.mjs'
  - '!node_modules/@ricky0123/vad-web/**'
  - 'node_modules/@ricky0123/vad-web/dist/silero_vad_legacy.onnx'
  - 'node_modules/@ricky0123/vad-web/dist/silero_vad_v5.onnx'
asarUnpack:
  - resources/**
win:
  executableName: 桌面助手
  # 多尺寸 ico（16~256，小帧内容撑满），避免任务栏图标因大图留白缩显得偏小
  icon: build/icon.ico
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # 向导式安装器（非一键）：允许用户自定义安装目录
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  # 未签名/notarize=false 时 entitlements 不生效，保留 JIT 兼容项以备开发签名
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: 桌面助手需要访问"文稿"文件夹以读写文件。
    - NSDownloadsFolderUsageDescription: 桌面助手需要访问"下载"文件夹以读写文件。
    - NSMicrophoneUsageDescription: 桌面助手需要使用麦克风进行语音对话。
  notarize: false
  category: public.app-category.productivity
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: desktop-agent
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# 只保留中文和英文语言包，去掉其余 ~45MB 的无用 Electron locales
electronLanguages:
  - zh-CN
  - en-US
publish:
  provider: generic
  url: https://example.com/auto-updates
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
